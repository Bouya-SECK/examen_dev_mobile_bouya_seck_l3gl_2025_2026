name: sunu_task
description: "Application de gestion de projets et taches - Cours Flutter L3GL Promo 2025/2026"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Stockage local pour l'onboarding et les preferences
  shared_preferences: ^2.5.4

  # Generation d'IDs uniques
  uuid: ^4.5.2

  # Gestion d'état
  provider: ^6.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/